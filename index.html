<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talen — Naamvallen &amp; Werkwoorden</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#221c15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Talen">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#221c15; --bg-edge:#161210; --card:#2c2419; --card-2:#332a1d;
    --ink:#f1e7d2; --ink-dim:#c7b998; --ink-faint:#96876a;
    --gold:#d9a441; --gold-dim:#a9803a;
    --nom:#c1453d; --gen:#d9a441; --dat:#5e8c6a; --acc:#4c7bb0; --abl:#a06fa3;
    --good:#5e8c6a; --bad:#c1453d; --radius:6px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background: radial-gradient(ellipse 1200px 800px at 50% -10%, var(--card) 0%, var(--bg) 55%, var(--bg-edge) 100%);
    background-color:var(--bg); color:var(--ink); font-family:'Nunito', sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:26px 20px 80px;}
  header{text-align:center;margin-bottom:20px;}
  h1{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(1.6rem, 5vw, 2.3rem);letter-spacing:0.5px;margin:0 0 6px;text-shadow:0 1px 0 rgba(0,0,0,.4);}
  .subtitle{color:var(--ink-dim);font-size:.95rem;margin:0 0 22px;font-style:italic;}

  nav.pillnav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  nav.pillnav button{
    font-family:'Nunito',sans-serif;font-weight:700;font-size:.92rem;color:var(--ink-dim);
    background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:var(--radius);
    padding:9px 16px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
  }
  nav.pillnav button:hover{border-color:var(--gold-dim);color:var(--ink);}
  nav.pillnav button.active{background:var(--gold);color:#221c15;border-color:var(--gold);}
  nav.pillnav.sub button{font-size:.85rem;padding:7px 14px;}
  nav.pillnav.sub2 button{font-size:.8rem;padding:6px 12px;background:transparent;}
  nav.pillnav.sub2 button.active{background:var(--gold-dim);color:#221c15;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  main{margin-top:22px;}
  h2{font-family:'Cinzel',serif;font-weight:700;font-size:1.3rem;color:var(--gold);border-bottom:1px solid rgba(217,164,65,0.3);padding-bottom:8px;margin:32px 0 14px;}
  h2:first-child{margin-top:0;}
  h3{font-family:'Cinzel',serif;font-weight:600;font-size:1.05rem;color:var(--ink);margin:20px 0 8px;}
  p{margin:0 0 14px;color:var(--ink-dim);}
  strong{color:var(--ink);}
  em{color:inherit;}

  .card{background:var(--card);border:1px solid rgba(217,164,65,0.2);border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);padding:16px 18px;margin-bottom:16px;}
  .case-card{background:var(--card);border-left:4px solid var(--case-color, var(--gold));border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;margin-bottom:12px;}
  .case-card h3{margin:0 0 6px;color:var(--case-color, var(--gold));font-variant:small-caps;letter-spacing:.5px;}
  .case-card .func{color:var(--ink-dim);font-size:.9rem;margin-bottom:8px;}
  .ex{margin:6px 0;padding-left:14px;border-left:2px solid rgba(255,255,255,0.08);}
  .ex .la{color:var(--ink);font-style:italic;}
  .ex .la b{color:var(--case-color, var(--gold));font-style:normal;}
  .ex .nl{color:var(--ink-faint);font-size:.88rem;}

  table{width:100%;border-collapse:collapse;margin:10px 0 20px;font-size:.92rem;}
  caption{text-align:left;color:var(--ink-dim);font-size:.82rem;margin-bottom:6px;font-style:italic;}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid rgba(217,164,65,0.15);}
  thead th{font-family:'Cinzel',serif;font-weight:600;color:var(--ink);font-size:.82rem;border-bottom:1px solid var(--gold-dim);}
  tbody th{font-family:'Cinzel',serif;font-weight:600;font-size:.8rem;font-variant:small-caps;letter-spacing:.3px;color:var(--case-color);white-space:nowrap;}
  tbody td{color:var(--ink-dim);}
  tbody tr:last-child td, tbody tr:last-child th{border-bottom:none;}

  .note{background:var(--card-2);border:1px dashed rgba(217,164,65,0.35);border-radius:var(--radius);padding:12px 16px;font-size:.88rem;color:var(--ink-dim);margin:14px 0;}

  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  @media (max-width:520px){.cat-grid{grid-template-columns:1fr;}}
  .cat-btn{background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer;color:var(--ink);font-family:'Nunito',sans-serif;}
  .cat-btn strong{display:block;font-family:'Cinzel',serif;color:var(--gold);font-size:.95rem;margin-bottom:3px;}
  .cat-btn span{color:var(--ink-faint);font-size:.82rem;}
  .cat-btn:hover{border-color:var(--gold);}
  .cat-btn.active{border-color:var(--gold);background:var(--card-2);box-shadow:0 0 0 1px var(--gold);}

  details.wordlist{margin-bottom:18px;}
  details.wordlist summary{cursor:pointer;color:var(--gold);font-family:'Cinzel',serif;font-size:.9rem;padding:6px 0;}
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 16px;margin-top:8px;font-size:.88rem;}
  .word-grid div{color:var(--ink-dim);border-bottom:1px solid rgba(255,255,255,.06);padding:4px 0;}
  .word-grid b{color:var(--ink);}

  .quiz-card{background:var(--card);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:20px;}
  .dir-toggle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .dir-label{font-size:.82rem;color:var(--ink-faint);}
  .dir-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:.8rem;color:var(--ink-dim);background:var(--card);border:1px solid rgba(217,164,65,0.25);border-radius:999px;padding:6px 14px;cursor:pointer;}
  .dir-btn:hover{border-color:var(--gold-dim);}
  .dir-btn.active{background:var(--gold);color:#221c15;border-color:var(--gold);}
  .input-row{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .check-btn{align-self:flex-start;}
  .text-input{flex:1;font-family:'Nunito',sans-serif;font-size:1rem;background:var(--card-2);border:1px solid rgba(217,164,65,0.3);color:var(--ink);border-radius:var(--radius);padding:11px 12px;}
  .text-input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .check-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;background:var(--gold);color:#221c15;border:none;border-radius:var(--radius);padding:11px 18px;cursor:pointer;}
  .check-btn:disabled{opacity:.6;cursor:default;}
  .quiz-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-faint);margin-bottom:12px;}
  .quiz-question{font-size:1.1rem;color:var(--ink);margin-bottom:4px;}
  .quiz-question .w{font-style:italic;color:var(--gold);}
  .quiz-question .w.hintable{cursor:pointer;border-bottom:1px dotted var(--gold);}
  .hint-text{font-family:'Nunito',sans-serif;letter-spacing:1px;color:var(--ink-faint);font-size:.9rem;min-height:1.2em;margin:2px 0 0;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  @media (max-width:480px){.options{grid-template-columns:1fr;}}
  .opt{font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:700;background:var(--card-2);border:1px solid rgba(217,164,65,0.3);color:var(--ink);border-radius:var(--radius);padding:11px;cursor:pointer;}
  .opt:hover:not(:disabled){border-color:var(--gold);}
  .opt.correct{background:var(--good);border-color:var(--good);color:#fff;}
  .opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff;}
  .opt:disabled{cursor:default;opacity:.85;}
  .feedback{margin-top:12px;min-height:1.4em;font-weight:700;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .next-btn{margin-top:14px;background:var(--gold);color:#221c15;border:none;border-radius:var(--radius);padding:10px 20px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;}
  .next-btn.show{display:inline-block;}

  .placeholder{text-align:center;padding:40px 20px;color:var(--ink-faint);}
  .placeholder .big{font-family:'Cinzel',serif;color:var(--gold);font-size:1.1rem;margin-bottom:8px;}

  footer{text-align:center;color:var(--ink-faint);font-size:.8rem;margin-top:50px;}
  .version-badge{position:fixed;top:8px;right:10px;font-family:'Nunito',sans-serif;font-size:.72rem;color:var(--ink-faint);background:var(--card);border:1px solid rgba(217,164,65,0.2);border-radius:999px;padding:3px 9px;z-index:50;}
</style>
</head>
<body>
<div class="version-badge">v1.18</div>
<div class="wrap">
  <header>
    <h1>Naamvallen &amp; Werkwoorden</h1>
    <p class="subtitle">Grammatica oefenen in het Latijn, Duits en Frans</p>
    <nav class="pillnav" id="lang-nav"></nav>
    <nav class="pillnav sub" id="topic-nav"></nav>
    <nav class="pillnav sub2" id="view-nav"></nav>
  </header>
  <main id="content"></main>
  <footer>Gemaakt om samen talen onder de knie te krijgen — succes!</footer>
</div>

<script>
(function(){
"use strict";

/* ================= GENERIC HELPERS ================= */
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function tableHTML(colHeaders, rowHeaders, cellFn, caption){
  let html = '<table>';
  if(caption) html += `<caption>${caption}</caption>`;
  html += `<thead><tr><th></th>${colHeaders.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  rowHeaders.forEach((rh,ri)=>{
    html += `<tr style="--case-color:${rh.color||'var(--gold)'};"><th>${rh.label}</th>`;
    colHeaders.forEach((c,ci)=>{ html += `<td>${cellFn(ri,ci)}</td>`; });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

/* ================= LATIN: NOUN ENGINE ================= */
function decl1(stem){ return { nomSg:stem+'a',genSg:stem+'ae',datSg:stem+'ae',accSg:stem+'am',ablSg:stem+'a',
  nomPl:stem+'ae',genPl:stem+'arum',datPl:stem+'is',accPl:stem+'as',ablPl:stem+'is' }; }
function decl2m(stem){ return { nomSg:stem+'us',genSg:stem+'i',datSg:stem+'o',accSg:stem+'um',ablSg:stem+'o',
  nomPl:stem+'i',genPl:stem+'orum',datPl:stem+'is',accPl:stem+'os',ablPl:stem+'is' }; }
function decl2n(stem){ return { nomSg:stem+'um',genSg:stem+'i',datSg:stem+'o',accSg:stem+'um',ablSg:stem+'o',
  nomPl:stem+'a',genPl:stem+'orum',datPl:stem+'is',accPl:stem+'a',ablPl:stem+'is' }; }
function decl3(nomSg,stem){ return { nomSg:nomSg,genSg:stem+'is',datSg:stem+'i',accSg:stem+'em',ablSg:stem+'e',
  nomPl:stem+'es',genPl:stem+'um',datPl:stem+'ibus',accPl:stem+'es',ablPl:stem+'ibus' }; }
function decl3n(nomSg,stem){ return { nomSg:nomSg,genSg:stem+'is',datSg:stem+'i',accSg:nomSg,ablSg:stem+'e',
  nomPl:stem+'a',genPl:stem+'um',datPl:stem+'ibus',accPl:stem+'a',ablPl:stem+'ibus' }; }

const LA_DECL1 = [['femina','vrouw'],['aqua','water'],['terra','aarde, land'],['rosa','roos'],['via','weg'],
  ['vita','leven'],['puella','meisje'],['insula','eiland'],['silva','bos'],['mensa','tafel'],['porta','poort'],
  ['stella','ster'],['luna','maan'],['pecunia','geld'],['patria','vaderland'],['epistula','brief'],['fabula','verhaal'],
  ['cena','maaltijd'],['nauta','matroos (m.)'],['agricola','boer (m.)'],['poeta','dichter (m.)'],['incola','inwoner'],
  ['ancilla','slavin'],['dea','godin'],['hora','uur']].map(([lat,nl])=>({lat,nl}));

const LA_DECL2 = [['servus','slaaf','m'],['dominus','heer, meester','m'],['amicus','vriend','m'],['deus','god','m'],
  ['filius','zoon','m'],['populus','volk','m'],['equus','paard','m'],['gladius','zwaard','m'],['lupus','wolf','m'],
  ['ventus','wind','m'],['annus','jaar','m'],['hortus','tuin','m'],['campus','veld','m'],['murus','muur','m'],
  ['ludus','spel, school','m'],['numerus','getal','m'],['oculus','oog','m'],['digitus','vinger','m'],['medicus','dokter','m'],
  ['discipulus','leerling','m'],['donum','geschenk','n'],['templum','tempel','n'],['bellum','oorlog','n'],
  ['verbum','woord','n'],['caelum','hemel','n']].map(([lat,nl,g])=>({lat,nl,g}));

const LA_DECL3 = [['rex','reg','koning','m'],['lex','leg','wet','f'],['pater','patr','vader','m'],['mater','matr','moeder','f'],
  ['frater','fratr','broer','m'],['soror','soror','zus','f'],['homo','homin','mens','m'],['miles','milit','soldaat','m'],
  ['dux','duc','leider','m'],['pax','pac','vrede','f'],['vox','voc','stem','f'],['lux','luc','licht','f'],
  ['virtus','virtut','moed, deugd','f'],['civitas','civitat','staat, burgerij','f'],['veritas','veritat','waarheid','f'],
  ['legio','legion','legioen','f'],['consul','consul','consul','m'],['sol','sol','zon','m'],['amor','amor','liefde','m'],
  ['labor','labor','werk','m'],['color','color','kleur','m'],['origo','origin','oorsprong','f'],
  ['imperator','imperator','bevelhebber','m'],['corpus','corpor','lichaam','n'],['tempus','tempor','tijd','n'],
  ['nomen','nomin','naam','n']].map(([lat,stem,nl,g])=>({lat,stem,nl,g}));

const LA_ADJ = [['bonus','goed'],['malus','slecht'],['magnus','groot'],['parvus','klein'],['longus','lang'],['altus','hoog, diep'],
  ['novus','nieuw'],['antiquus','oud'],['latus','breed'],['clarus','beroemd, helder'],['plenus','vol'],['primus','eerste'],
  ['secundus','tweede'],['multus','veel'],['paucus','weinig'],['verus','waar'],['falsus','vals'],['aequus','gelijk'],
  ['rectus','recht, juist'],['sanctus','heilig'],['Romanus','Romeins'],['Graecus','Grieks'],['humanus','menselijk'],
  ['divinus','goddelijk'],['aeternus','eeuwig']].map(([lat,nl])=>({lat,nl}));

/* Small curated word set for "taal -> NL" phrase questions (short two-word combos / mini sentences) */
const STANDAARD_LA = [
  {lat:'vir', stem:'vir', type:'decl2m', nomOverride:'vir', nl:'de man', nlPl:'de mannen'},
  {lat:'gladius', stem:'gladi', type:'decl2m', nl:'het zwaard', nlPl:'de zwaarden'},
  {lat:'femina', stem:'femin', type:'decl1', nl:'de vrouw', nlPl:'de vrouwen'},
  {lat:'servus', stem:'serv', type:'decl2m', nl:'de slaaf', nlPl:'de slaven'},
  {lat:'rex', stem:'reg', type:'decl3', nl:'de koning', nlPl:'de koningen'},
  {lat:'puella', stem:'puell', type:'decl1', nl:'het meisje', nlPl:'de meisjes'}
];
function laStandaardForms(w){
  if(w.type==='decl1') return decl1(w.stem);
  if(w.type==='decl3') return decl3(w.lat, w.stem);
  const f = decl2m(w.stem);
  if(w.nomOverride) f.nomSg = w.nomOverride;
  return f;
}
function laPickStandaard(exclude){
  let w;
  do{ w = STANDAARD_LA[Math.floor(Math.random()*STANDAARD_LA.length)]; } while(exclude && w===exclude);
  return w;
}
function laPhraseQuestion(){
  const caseKey = ['nom','gen','dat','acc','abl'][Math.floor(Math.random()*5)];
  if(caseKey==='gen'){
    const w1=laPickStandaard(), w2=laPickStandaard(w1);
    const f1=laStandaardForms(w1), f2=laStandaardForms(w2);
    const phrase = `${f1.nomSg} ${f2.genSg}`;
    const correct = `${w1.nl} van ${w2.nl}`;
    const d0 = `${w2.nl} van ${w1.nl}`, d1 = `${w1.nl} aan/voor ${w2.nl}`, d2 = `${w1.nl} door/met/in ${w2.nl}`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${f2.nomSg} ${f1.genSg}" betekenen (bezit omgekeerd)`;
    altLookup[normAnswer(d1)] = `dat is de datief-lezing van "${f2.datSg}", niet de genitief van "${f2.genSg}"`;
    altLookup[normAnswer(d2)] = `dat is de ablatief-lezing van "${f2.ablSg}", niet de genitief van "${f2.genSg}"`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  if(caseKey==='acc'){
    const w1=laPickStandaard(), w2=laPickStandaard(w1);
    const f1=laStandaardForms(w1), f2=laStandaardForms(w2);
    const phrase = `${f1.nomSg} ${f2.accSg} videt.`;
    const correct = `${w1.nl} ziet ${w2.nl}.`;
    const d0 = `${w2.nl} ziet ${w1.nl}.`, d1 = `${w1.nl} is ${w2.nl}.`, d2 = `${w2.nl} is ${w1.nl}.`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${f2.nomSg} ${f1.accSg} videt." betekenen (onderwerp en lijdend voorwerp omgekeerd)`;
    altLookup[normAnswer(d1)] = `"videt" betekent "ziet", niet "is"`;
    altLookup[normAnswer(d2)] = `"videt" betekent "ziet", niet "is", en het onderwerp/voorwerp staan omgekeerd`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  const w1 = laPickStandaard();
  const f1 = laStandaardForms(w1);
  const number = Math.random()<0.5 ? 'Sg' : 'Pl';
  const nl = number==='Sg' ? w1.nl : w1.nlPl;
  const formKey = caseKey + number;
  const latWord = f1[formKey];
  const templateFns = { nom:(x)=>x, dat:(x)=>'aan/voor '+x, abl:(x)=>'door/met/in '+x };
  const correct = templateFns[caseKey](nl);
  const otherKeys = ['nom','dat','abl'].filter(k=>k!==caseKey);
  const w2 = laPickStandaard(w1);
  const nl2 = number==='Sg' ? w2.nl : w2.nlPl;
  const distractors = [templateFns[otherKeys[0]](nl), templateFns[otherKeys[1]](nl), templateFns[caseKey](nl2)];
  const altLookup = {};
  altLookup[normAnswer(distractors[0])] = `dat is de ${CASE_LABEL[otherKeys[0]]}-lezing, niet de ${CASE_LABEL[caseKey]}`;
  altLookup[normAnswer(distractors[1])] = `dat is de ${CASE_LABEL[otherKeys[1]]}-lezing, niet de ${CASE_LABEL[caseKey]}`;
  altLookup[normAnswer(distractors[2])] = `dat is de betekenis van "${w2.lat}" (een ander woord), niet van "${latWord}"`;

  return { questionHTML:`Wat betekent <span class="w">${latWord}</span>?`, correct, mcOptions:shuffle([correct,...distractors]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
}

const GENDER_LABEL = {m:'mannelijk', f:'vrouwelijk', n:'onzijdig'};
const CASE_LABEL = {nom:'nominatief', gen:'genitief', dat:'datief', acc:'accusatief', abl:'ablatief'};
const NUM_LABEL = {Sg:'enkelvoud', Pl:'meervoud'};

/* ================= LATIN: VERB ENGINE ================= */
function conj1(stem){ return {
  pres:[stem+'o',stem+'as',stem+'at',stem+'amus',stem+'atis',stem+'ant'],
  impf:[stem+'abam',stem+'abas',stem+'abat',stem+'abamus',stem+'abatis',stem+'abant'],
  fut:[stem+'abo',stem+'abis',stem+'abit',stem+'abimus',stem+'abitis',stem+'abunt'] }; }
function conj2(stem){ return {
  pres:[stem+'eo',stem+'es',stem+'et',stem+'emus',stem+'etis',stem+'ent'],
  impf:[stem+'ebam',stem+'ebas',stem+'ebat',stem+'ebamus',stem+'ebatis',stem+'ebant'],
  fut:[stem+'ebo',stem+'ebis',stem+'ebit',stem+'ebimus',stem+'ebitis',stem+'ebunt'] }; }
function conj3(stem){ return {
  pres:[stem+'o',stem+'is',stem+'it',stem+'imus',stem+'itis',stem+'unt'],
  impf:[stem+'ebam',stem+'ebas',stem+'ebat',stem+'ebamus',stem+'ebatis',stem+'ebant'],
  fut:[stem+'am',stem+'es',stem+'et',stem+'emus',stem+'etis',stem+'ent'] }; }
function conj4(stem){ return {
  pres:[stem+'io',stem+'is',stem+'it',stem+'imus',stem+'itis',stem+'iunt'],

/* ================= GERMAN: NOUN (ARTICLE) ENGINE ================= */
function deArtForms(gender){
  const M={nomSg:'der',genSg:'des',datSg:'dem',accSg:'den'};
  const F={nomSg:'die',genSg:'der',datSg:'der',accSg:'die'};
  const N={nomSg:'das',genSg:'des',datSg:'dem',accSg:'das'};
  const PL={nomPl:'die',genPl:'der',datPl:'den',accPl:'die'};
  const sg = gender==='m'?M:gender==='f'?F:N;
  return Object.assign({}, sg, PL);
}

/* Small curated word set for "taal -> NL" phrase questions */
const STANDAARD_DE = [
  {de:'Mann', g:'m', nl:'de man', genSuffix:'es'},
  {de:'Schwert', g:'n', nl:'het zwaard', genSuffix:'es'},
  {de:'Frau', g:'f', nl:'de vrouw', genSuffix:''},
  {de:'König', g:'m', nl:'de koning', genSuffix:'s'},
  {de:'Kind', g:'n', nl:'het kind', genSuffix:'es'}
];
function dePickStandaard(exclude){
  let w;
  do{ w = STANDAARD_DE[Math.floor(Math.random()*STANDAARD_DE.length)]; } while(exclude && w===exclude);
  return w;
}
function dePhraseFor(w, caseKey){
  const art = deArtForms(w.g)[caseKey+'Sg'];
  const noun = caseKey==='gen' ? w.de + w.genSuffix : w.de;
  return `${art} ${noun}`;
}
function dePhraseQuestion(){
  const caseKey = ['nom','gen','dat','acc'][Math.floor(Math.random()*4)];
  if(caseKey==='gen'){
    const w1=dePickStandaard(), w2=dePickStandaard(w1);
    const phrase = `${dePhraseFor(w1,'nom')} ${dePhraseFor(w2,'gen')}`;
    const correct = `${w1.nl} van ${w2.nl}`;
    const d0 = `${w2.nl} van ${w1.nl}`, d1 = `${w1.nl} aan/voor ${w2.nl}`, d2 = `${w1.nl} en ${w2.nl}`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${dePhraseFor(w2,'nom')} ${dePhraseFor(w1,'gen')}" betekenen (bezit omgekeerd)`;
    altLookup[normAnswer(d1)] = `dat is de datief-lezing van "${dePhraseFor(w2,'dat')}", niet de genitief van "${dePhraseFor(w2,'gen')}"`;
    altLookup[normAnswer(d2)] = `er staat geen "en" of los rijtje, maar een bezitsrelatie ("van")`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  if(caseKey==='acc'){
    const w1=dePickStandaard(), w2=dePickStandaard(w1);
    const phrase = `${dePhraseFor(w1,'nom')} sieht ${dePhraseFor(w2,'acc')}.`;
    const correct = `${w1.nl} ziet ${w2.nl}.`;
    const d0 = `${w2.nl} ziet ${w1.nl}.`, d1 = `${w1.nl} is ${w2.nl}.`, d2 = `${w2.nl} is ${w1.nl}.`;
    const altLookup = {};
    altLookup[normAnswer(d0)] = `dat zou "${dePhraseFor(w2,'nom')} sieht ${dePhraseFor(w1,'acc')}." betekenen (onderwerp en lijdend voorwerp omgekeerd)`;
    altLookup[normAnswer(d1)] = `"sieht" betekent "ziet", niet "is"`;
    altLookup[normAnswer(d2)] = `"sieht" betekent "ziet", niet "is", en onderwerp/voorwerp staan omgekeerd`;
    return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,d0,d1,d2]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
  }
  const w1 = dePickStandaard();
  const phrase = dePhraseFor(w1, caseKey);
  const templateFns = { nom:(x)=>x, dat:(x)=>'aan/voor '+x };
  const otherKey = caseKey==='nom' ? 'dat' : 'nom';
  const correct = templateFns[caseKey](w1.nl);
  const w2 = dePickStandaard(w1);
  const distractors = [templateFns[otherKey](w1.nl), templateFns[caseKey](w2.nl), templateFns[otherKey](w2.nl)];
  const altLookup = {};
  altLookup[normAnswer(distractors[0])] = `dat is de ${DE_CASE_LABEL[otherKey]}-lezing, niet de ${DE_CASE_LABEL[caseKey]}`;
  altLookup[normAnswer(distractors[1])] = `dat is de betekenis van "${dePhraseFor(w2,caseKey)}" (een ander woord), niet van "${phrase}"`;
  altLookup[normAnswer(distractors[2])] = `dat is zowel een ander woord als de verkeerde naamval`;
  return { questionHTML:`Wat betekent <span class="w">${phrase}</span>?`, correct, mcOptions:shuffle([correct,...distractors]), accept:(v)=>({ok: normAnswer(v)===normAnswer(correct), typo:false}), altLookup };
}

/* ================= GERMAN: VERB ENGINE ================= */
function dePresentForms(stem, needsE){
  return needsE
    ? [stem+'e',stem+'est',stem+'et',stem+'en',stem+'et',stem+'en']
    : [stem+'e',stem+'st',stem+'t',stem+'en',stem+'t',stem+'en'];
}
const DE_HABEN = ['habe','hast','hat','haben','habt','haben'];
function dePerfektForms(stem, needsE){
  const participle = 'ge'+stem+(needsE?'et':'t');
  return DE_HABEN.map(h=>h+' '+participle);
}

function renderNav(){
  Array.from(langNav.children).forEach(b=>b.classList.toggle('active', b.dataset.id===currentLang));
  Array.from(topicNav.children).forEach(b=>b.classList.toggle('active', b.dataset.id===currentTopic));
  viewNav.innerHTML = '';
  if(currentTopic!=='vocab'){
    ['leren','oefenen'].forEach(v=>{
      const b = document.createElement('button');
      b.textContent = v==='leren' ? 'Leren' : 'Oefenen';
      b.dataset.id = v;
      b.classList.toggle('active', v===currentView);
      b.addEventListener('click', ()=>{ currentView=v; render(); });
      viewNav.appendChild(b);
    });
  }
}

function laNounLeren(){
  return `
  <h2>Wat is een naamval?</h2>
  <p>In het Latijn verandert een zelfstandig naamwoord van vorm afhankelijk van zijn functie in de zin. Daardoor mag de woordvolgorde vrij zijn: <em>"Canis puellam videt."</em> en <em>"Puellam canis videt."</em> betekenen allebei <strong>"De hond ziet het meisje"</strong> — het is <em>puellam</em> (met -m) dat vertelt wie er wordt gezien.</p>
  <div class="note">De woordvolgorde is niet helemaal betekenisloos: het woord dat <strong>vooraan</strong> in de zin staat, krijgt de meeste nadruk. <em>"Puellam canis videt"</em> legt dus net iets meer klemtoon op <em>puellam</em> (het meisje) dan de neutrale volgorde <em>"Canis puellam videt"</em> — ongeveer zoals in het Nederlands "Het méisje ziet de hond" net iets anders klinkt dan "De hond ziet het meisje".</div>

  <div class="case-card" style="--case-color:var(--nom);"><h3>Nominativus</h3><p class="func">Onderwerp. Vraag: <em>wie/wat?</em></p><div class="ex"><div class="la"><b>Puella</b> cantat.</div><div class="nl">Het meisje zingt.</div></div></div>
  <div class="case-card" style="--case-color:var(--gen);"><h3>Genitivus</h3><p class="func">Bezit, een "van"-relatie.</p><div class="ex"><div class="la">Liber <b>puellae</b> in mensa est.</div><div class="nl">Het boek van het meisje ligt op tafel.</div></div></div>
  <div class="case-card" style="--case-color:var(--dat);"><h3>Dativus</h3><p class="func">Meewerkend voorwerp: aan/voor wie?</p><div class="ex"><div class="la">Pater <b>filio</b> librum dat.</div><div class="nl">Vader geeft een boek aan zijn zoon.</div></div></div>
  <div class="case-card" style="--case-color:var(--acc);"><h3>Accusativus</h3><p class="func">Lijdend voorwerp.</p><div class="ex"><div class="la">Puella <b>canem</b> videt.</div><div class="nl">Het meisje ziet de hond.</div></div></div>
  <div class="case-card" style="--case-color:var(--abl);"><h3>Ablativus</h3><p class="func">Door, met, vanaf, in.</p><div class="ex"><div class="la">Miles <b>gladio</b> pugnat.</div><div class="nl">De soldaat vecht met een zwaard.</div></div></div>

  <div class="note">Een zesde naamval, de <strong>vocativus</strong> (aanspreekvorm), is meestal gelijk aan de nominativus — behalve bij woorden op <em>-us</em>/<em>-ius</em> in de 2e verbuigingsgroep: <em>servus → serve</em>, <em>filius → fili</em>.</div>

  <h2>Verbuigingsgroepen</h2>
  <p>Je herkent de verbuigingsgroep van een woord aan de genitief enkelvoud: <em>-ae</em> (1e), <em>-i</em> (2e), <em>-is</em> (3e).</p>

  <h3>1e verbuigingsgroep — femina, feminae (de vrouw)</h3>
  ${tableHTML(['Enkelvoud','Meervoud'], [
    {label:'Nom.',color:'var(--nom)'},{label:'Gen.',color:'var(--gen)'},{label:'Dat.',color:'var(--dat)'},
    {label:'Acc.',color:'var(--acc)'},{label:'Abl.',color:'var(--abl)'}
  ], (r,c)=>{
    const f = decl1('femin'); const keys=['nomSg','genSg','datSg','accSg','ablSg','nomPl','genPl','datPl','accPl','ablPl'];
    return f[keys[r + (c*5)]];
  })}

  <h3>2e verbuigingsgroep — mannelijk: servus, servi / onzijdig: donum, doni</h3>
  ${tableHTML(['servus (m.) ev','servus mv','donum (o.) ev','donum mv'], [
    {label:'Nom.',color:'var(--nom)'},{label:'Gen.',color:'var(--gen)'},{label:'Dat.',color:'var(--dat)'},
    {label:'Acc.',color:'var(--acc)'},{label:'Abl.',color:'var(--abl)'}
  ], (r,c)=>{
    const keys=['nomSg','genSg','datSg','accSg','ablSg','nomPl','genPl','datPl','accPl','ablPl'];
    const m = decl2m('serv'); const n = decl2n('don');
    if(c===0) return m[keys[r]]; if(c===1) return m[keys[r+5]]; if(c===2) return n[keys[r]]; return n[keys[r+5]];
  })}
  <div class="note">Bij onzijdige woorden zijn nominatief en accusatief altijd gelijk.</div>

  <h3>3e verbuigingsgroep — rex, regis / onzijdig: nomen, nominis</h3>
  ${tableHTML(['rex (m.) ev','rex mv','nomen (o.) ev','nomen mv'], [

    {label:'Acc.',color:'var(--acc)'},{label:'Abl.',color:'var(--abl)'}
  ], (r,c)=>{
    const keys=['nomSg','genSg','datSg','accSg','ablSg','nomPl','genPl','datPl','accPl','ablPl'];

/* ================= GENERIC OEFENEN ENGINE ================= */
// Turns "Wie alt ist deine Mutter / dein Vater?" into the two full, valid
// sentences ["Wie alt ist deine Mutter?", "Wie alt ist dein Vater?"] instead
// of naively chopping the string in half at "/" (which would wrongly split
// off a bare sentence fragment like "dein Vater?" as if it were a complete
// answer on its own). When there's no shared context to preserve — e.g.
// "oft / häufig" — it just returns the two standalone words/phrases.
function splitAlternatives(s){
  if(!s.includes('/')) return [s];
  const bits = s.split('/');
  if(bits.length !== 2) return [s];
  const left = bits[0].trim(), right = bits[1].trim();
  if(!left || !right) return [s];
  const leftWords = left.split(/\s+/);
  const rightWords = right.split(/\s+/);
  const lastRight = rightWords[rightWords.length-1];
  const m = lastRight.match(/^(.*?)([?.!,;:]*)$/);
  const rightCoreWords = rightWords.slice(0,-1).concat(m[1] ? [m[1]] : []);
  const suffix = m[2] || '';
  const n = rightCoreWords.length;
  if(n===0 || leftWords.length <= n) return [left, right];
  const altLeft = leftWords.slice(leftWords.length-n);
  const prefixWords = leftWords.slice(0, leftWords.length-n);
  return [
    [...prefixWords, ...altLeft].join(' ') + suffix,
    [...prefixWords, ...rightCoreWords].join(' ') + suffix
  ];
}
function normalizeNl(nl){
  // Split on comma (synonyms: "veelkleurig, bont"), then split each part
  // on slash via splitAlternatives (either/or alternatives, sentence-aware).
  const cleaned = nl.replace(/\([^)]*\)/g,'');
  const out = [];
  cleaned.split(',').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    splitAlternatives(part).forEach(v=>{ if(v) out.push(v.trim().toLowerCase()); });
  });
  return out;
}
function normAnswer(s){ return s.trim().toLowerCase(); }

function renderOefenCategoryPicker(cats, questionTemplate, lemmaFn, describeForm){
  const wrapId = 'oefen-' + Math.random().toString(36).slice(2,8);
  setTimeout(()=>initOefenen(wrapId, cats, questionTemplate, lemmaFn, describeForm), 0);
  return `<div id="${wrapId}">
    <h2>Kies een categorie</h2>
    <div class="cat-grid" data-role="cat-grid"></div>
    <details class="wordlist" data-role="wordlist-wrap">
      <summary>Bekijk de woorden van deze groep</summary>
      <div class="word-grid" data-role="word-grid"></div>
    </details>
    <div class="dir-toggle" data-role="dir-toggle" style="display:none;">
      <span class="dir-label">Richting:</span>
      <button class="dir-btn active" data-dir="nl2target">NL → taal</button>
      <button class="dir-btn" data-dir="target2nl">Taal → NL</button>
      <button class="dir-btn" data-dir="both">Beide</button>
    </div>
    <div data-role="quiz-area" style="display:none;">
      <div class="quiz-card">
        <div class="quiz-meta"><span data-role="score-display">Score: 0 / 0</span><span data-role="streak-display">Reeks: 0</span></div>
        <p class="quiz-question" data-role="question-text"></p>
        <p class="hint-text" data-role="hint-text"></p>
        <div class="options" data-role="options"></div>
        <div class="input-row" data-role="input-row" style="display:none;">
          <input type="text" class="text-input" data-role="text-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ je antwoord...">
          <button class="check-btn" data-role="check-btn">Controleer</button>
        </div>
        <p class="feedback" data-role="feedback"></p>
        <button class="next-btn" data-role="next-btn">Volgende vraag →</button>
      </div>
    </div>
  </div>`;
}

function initOefenen(wrapId, cats, questionTemplate, lemmaFn, describeForm){
  const root = document.getElementById(wrapId);
  if(!root) return;
  const catGrid = root.querySelector('[data-role="cat-grid"]');
  const wordGrid = root.querySelector('[data-role="word-grid"]');
  const wordlistWrap = root.querySelector('[data-role="wordlist-wrap"]');
  const dirToggle = root.querySelector('[data-role="dir-toggle"]');
  const quizArea = root.querySelector('[data-role="quiz-area"]');
  const questionText = root.querySelector('[data-role="question-text"]');
  const hintText = root.querySelector('[data-role="hint-text"]');
  const optionsEl = root.querySelector('[data-role="options"]');
  const inputRow = root.querySelector('[data-role="input-row"]');
  const textInput = root.querySelector('[data-role="text-input"]');
  const checkBtn = root.querySelector('[data-role="check-btn"]');
  const feedbackEl = root.querySelector('[data-role="feedback"]');
  const nextBtn = root.querySelector('[data-role="next-btn"]');
  const scoreDisplay = root.querySelector('[data-role="score-display"]');
  const streakDisplay = root.querySelector('[data-role="streak-display"]');

  let catKey = null;
  let direction = 'nl2target';
  let score=0,total=0,streak=0,current=null,hintTaps=0;

  Object.keys(cats).forEach(key=>{
    const cat = cats[key];
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = `<strong>${cat.title}</strong><span>${cat.sub} — ${cat.words.length} woorden</span>`;
    btn.addEventListener('click', ()=>selectCategory(key));
    catGrid.appendChild(btn);
  });

  Array.from(dirToggle.querySelectorAll('.dir-btn')).forEach(b=>{
    b.addEventListener('click', ()=>{
      direction = b.dataset.dir;
      Array.from(dirToggle.querySelectorAll('.dir-btn')).forEach(x=>x.classList.toggle('active', x===b));
      nextQuestion();
    });
  });

  function selectCategory(key){
    catKey = key;
    Array.from(catGrid.children).forEach((b,i)=>b.classList.toggle('active', Object.keys(cats)[i]===key));
    const cat = cats[key];
    wordGrid.innerHTML = cat.words.map(w=>`<div><b>${lemmaFn(w)}</b> — ${w.nl}</div>`).join('');
    wordlistWrap.open = false;
    dirToggle.style.display = 'flex';
    quizArea.style.display = 'block';
    score=0; total=0; streak=0;
    updateScore();
    nextQuestion();
  }

  function updateScore(){
    const scoreDisp = Number.isInteger(score) ? score : score.toFixed(1);
    scoreDisplay.textContent = `Score: ${scoreDisp} / ${total}`;
    streakDisplay.textContent = `Reeks: ${streak}`;
  }

  function pickWord(){
    const cat = cats[catKey];
    return cat.words[Math.floor(Math.random()*cat.words.length)];
  }

  function buildVormQuestion(){
    const cat = cats[catKey];
    const word = pickWord();
    const forms = cat.forms(word);
    const formKeys = Object.keys(forms).filter(k=>k!=='gender');
    const formKey = formKeys[Math.floor(Math.random()*formKeys.length)];
    const correct = forms[formKey];
    const allValues = Array.from(new Set(formKeys.map(k=>forms[k])));
    const wrongPool = shuffle(allValues.filter(v=>v!==correct));
    const altLookup = {};
    if(describeForm){
      formKeys.forEach(k=>{
        if(k===formKey) return;
        const val = forms[k];
        if(normAnswer(val)===normAnswer(correct)) return;
        altLookup[normAnswer(val)] = `"${val}" is de ${describeForm(word,k,forms)}`;
      });
    }
    return {
      type:'vorm',
      questionHTML: questionTemplate(word, formKey, forms),
      correct,
      mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
      accept: (val)=> ({ ok: normAnswer(val)===normAnswer(correct), typo:false }),
      altLookup
    };
  }

  function buildVertaalQuestion(){
    const cat = cats[catKey];
    if(cat.vertaalFn){
      return Object.assign({type:'vertaal'}, cat.vertaalFn());
    }
    const word = pickWord();
    const lemma = lemmaFn(word);
    const correct = word.nl;
    const others = cat.words.filter(w=>w!==word);
    const wrongPool = shuffle(others.map(w=>w.nl));
    const altLookup = {};
    others.forEach(w2=>{
      normalizeNl(w2.nl).forEach(m=>{ altLookup[m] = `"${lemmaFn(w2)}" betekent "${w2.nl}"`; });
    });
    return {
      type:'vertaal',
      questionHTML: `Wat betekent <span class="w">${lemma}</span>?`,
      correct,
      mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
      accept: (val)=> ({ ok: normalizeNl(correct).includes(normAnswer(val)), typo:false }),
      altLookup
    };
  }

  function buildVocabQuestion(dirType){
    const cat = cats[catKey];
    const word = pickWord();
    const others = cat.words.filter(w=>w!==word);
    const altLookup = {};
    if(dirType==='t2nl'){
      const correct = word.nl;
      const wrongPool = shuffle(others.map(w=>w.nl));
      others.forEach(w2=>{ normalizeNl(w2.nl).forEach(m=>{ altLookup[m] = `"${lemmaFn(w2)}" betekent "${w2.nl}"`; }); });
      return {
        type:'vertaal',
        questionHTML: `Wat betekent <span class="w">${lemmaFn(word)}</span>?`,
        correct,
        mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
        accept: (v)=> ({ ok: normalizeNl(correct).includes(normAnswer(v)), typo:false }),
        altLookup
      };
    }
    const correct = lemmaFn(word);
    const wrongPool = shuffle(others.map(w=>lemmaFn(w)));
    others.forEach(w2=>{ altLookup[normAnswer(lemmaFn(w2))] = `"${lemmaFn(w2)}" betekent "${w2.nl}"`; });
    return {
      type:'vertaal',
      questionHTML: `Wat is het woord voor <span class="w">${word.nl}</span>?`,
      correct,
      mcOptions: shuffle([correct, ...wrongPool.slice(0,3)]),
      accept: (v)=> ({ ok: splitAlternatives(correct).some(alt=>normAnswer(alt)===normAnswer(v)), typo:false }),
      altLookup
    };
  }

  function nextQuestion(){
    const cat = cats[catKey];
    let type;
    if(cat.vocabOnly){
      if(direction==='nl2target') type='vocab_nl2t';
      else if(direction==='target2nl') type='vocab_t2nl';
      else type = Math.random()<0.5 ? 'vocab_nl2t' : 'vocab_t2nl';
      current = buildVocabQuestion(type==='vocab_nl2t' ? 'nl2t' : 't2nl');
    } else {
      if(direction==='nl2target') type='vorm';
      else if(direction==='target2nl') type='vertaal';
      else type = Math.random()<0.5 ? 'vorm' : 'vertaal';
      current = type==='vorm' ? buildVormQuestion() : buildVertaalQuestion();
    }
    current.answerMode = Math.random()<(1/3) ? 'mc' : 'input';
    hintTaps = 0;

    questionText.innerHTML = current.questionHTML;
    hintText.textContent = '';
    feedbackEl.textContent=''; feedbackEl.className='feedback';
    nextBtn.classList.remove('show');
    textInput.value=''; textInput.disabled=false;
    checkBtn.disabled=false;

    const wEl = questionText.querySelector('.w');
    if(wEl){
      wEl.classList.add('hintable');
      wEl.title = 'Tik voor een hint';
      wEl.addEventListener('click', onHintTap);
    }

    if(current.answerMode==='mc'){
      inputRow.style.display='none';
      optionsEl.style.display='grid';
      optionsEl.innerHTML = '';
      current.mcOptions.forEach(opt=>{
        const b = document.createElement('button');
        b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', ()=>checkAnswer(opt,b));
        optionsEl.appendChild(b);
      });
    } else {
      optionsEl.style.display='none';
      optionsEl.innerHTML = '';
      inputRow.style.display='flex';
      setTimeout(()=>textInput.focus(), 0);
    }
  }

  function onHintTap(){
    hintTaps++;
    let shown=0, out='';
    for(const ch of current.correct){
      if(/[a-zA-ZÀ-ÿ]/.test(ch)){
        shown++;
        out += shown<=hintTaps ? ch : '_';
      } else {
        out += ch;
      }
    }
    hintText.textContent = 'Hint: ' + out;
  }

  function submitInput(){
    if(textInput.disabled) return;
    checkAnswer(textInput.value, null);
  }
  checkBtn.addEventListener('click', submitInput);
  textInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitInput(); });

  function checkAnswer(chosen, btnEl){
    total++;
    let isCorrect=false, altMsg=null;
    if(current.answerMode==='mc'){
      isCorrect = (chosen===current.correct);
    } else {
      const normChosen = normAnswer(chosen);
      const knownAlt = current.altLookup && current.altLookup[normChosen];
      const match = current.accept(chosen);
      if(match.ok){
        isCorrect = true;
      } else if(knownAlt){
        isCorrect = false; altMsg = knownAlt;
      } else {
        isCorrect = false;
      }
    }
    if(current.answerMode==='mc'){
      Array.from(optionsEl.children).forEach(b=>b.disabled=true);
      if(btnEl) btnEl.classList.add(isCorrect?'correct':'wrong');
      if(!isCorrect){
        Array.from(optionsEl.children).forEach(b=>{ if(b.textContent===current.correct) b.classList.add('correct'); });
      }
    } else {
      textInput.disabled=true; checkBtn.disabled=true;
    }

    let credit, reason;
    if(isCorrect){
      if(hintTaps===0) credit='full';
      else if(hintTaps===1) credit='half';
      else { credit='none'; reason='toomanyhints'; }
    } else {
      credit='none'; reason='wrong';
    }

    if(credit==='full'){
      score++; streak++;
      feedbackEl.textContent = 'Goed zo!';
      feedbackEl.className='feedback good';
    } else if(credit==='half'){
      score += 0.5; streak=0;
      feedbackEl.textContent = 'Half goed — je gebruikte een hint.';
      feedbackEl.className='feedback good';
    } else if(reason==='toomanyhints'){
      streak=0;
      feedbackEl.textContent=`Dat klopt, maar met zoveel hints telt het niet mee. Het antwoord was "${current.correct}".`;
      feedbackEl.className='feedback bad';
    } else {
      streak=0;
      let msg = `Niet helemaal — het juiste antwoord is "${current.correct}".`;
      if(altMsg){
        msg = `Fout — ${altMsg}, juist is: "${current.correct}".`;
      } else if(current.answerMode==='input' && current.altLookup){
        const alt = current.altLookup[normAnswer(chosen)];
        if(alt) msg = `Fout — ${alt}, juist is: "${current.correct}".`;
      }
      feedbackEl.textContent = msg;
      feedbackEl.className='feedback bad';
    }
    updateScore();
    nextBtn.classList.add('show');
  }

  nextBtn.addEventListener('click', nextQuestion);
  selectCategory(Object.keys(cats)[0]);
}

/* ================= MASTER RENDER ================= */
function render(){
  renderNav();
  let html = '';
  if(currentTopic==='vocab'){ html = currentLang==='de' ? deVocabOefenen() : vocabPlaceholder(); }
  else if(currentLang==='la'){
    html = currentTopic==='nouns' ? (currentView==='leren'?laNounLeren():laNounOefenen()) : (currentView==='leren'?laVerbLeren():laVerbOefenen());
  } else if(currentLang==='de'){
    html = currentTopic==='nouns' ? (currentView==='leren'?deNounLeren():deNounOefenen()) : (currentView==='leren'?deVerbLeren():deVerbOefenen());
  } else if(currentLang==='fr'){
    html = currentTopic==='nouns' ? (currentView==='leren'?frNounLeren():frNounOefenen()) : (currentView==='leren'?frVerbLeren():frVerbOefenen());
  }
  content.innerHTML = html;
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
})();
</script>
